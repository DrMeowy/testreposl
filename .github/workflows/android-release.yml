name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbridge-gradle-log
          path: android-client/build.log
          if-no-files-found: ignore

      - name: Fail after preserving diagnostics
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Moonbridge-Android-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonbridge-android
          path: android-client/Moonbridge-Android-debug.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android-client/Moonbridge-Android-debug.apk
